<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 360" role="img" aria-label="Acher Krief">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#10243a"/>
      <stop offset="1" stop-color="#030a14"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0cf7a"/>
      <stop offset="1" stop-color="#b68d3e"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#071424" flood-opacity=".10"/>
    </filter>
  </defs>
  <rect width="1500" height="360" fill="#fbfaf8"/>
  <g filter="url(#softShadow)">
    <text x="105" y="226" font-family="Cormorant Garamond, Georgia, serif" font-size="190" font-weight="600" letter-spacing="-16" fill="url(#navy)">A</text>
    <text x="275" y="226" font-family="Cormorant Garamond, Georgia, serif" font-size="190" font-weight="600" letter-spacing="-18" fill="url(#gold)">K</text>
    <text x="515" y="213" font-family="Cormorant Garamond, Georgia, serif" font-size="116" font-weight="500" letter-spacing="22" fill="#071424">ACHER KRIEF</text>
  </g>
</svg>